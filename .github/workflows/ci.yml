name: Verification du client PHP

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4', '8.5']
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          tools: composer:v2
          coverage: none
      - name: Valider le paquet Composer
        run: composer validate --strict --no-check-publish
      - name: Installer la bibliotheque
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verifier la syntaxe
        run: php tests/lint.php
      - name: Executer les tests unitaires sans acces SaaS
        run: php tests/run.php
      - name: Verifier le contrat public PHP sans acces SaaS
        run: php tests/public-api.php
      - name: Verifier la reference PHP et les liens Markdown
        run: php tests/docs.php
      - name: Verifier le mode aide sans acces SaaS
        run: php bin/loxya-read-check.php --help
      - name: Valider le controle de publication (sans acces SaaS)
        run: |
          bash -n scripts/release-check.sh
          bash -n tests/release-workflow.sh
          bash tests/release-workflow.sh
      - name: Verifier la syntaxe YAML du workflow de publication
        run: ruby -ryaml -e 'YAML.parse_file(".github/workflows/publish-release.yml")'
